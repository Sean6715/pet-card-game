<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萌寵冒險：進階策略卡牌對決</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            position: relative;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        h1 {
            color: #38bdf8;
            margin: 0;
            font-size: 24px;
        }
        .btn-info {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-info:hover {
            background: #0284c7;
        }
        .desc {
            color: #94a3b8;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .battlefield-banner {
            background: #0284c7;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .status-panel {
            display: flex;
            justify-content: space-around;
            background: #334155;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .status-item {
            text-align: center;
            font-size: 13px;
            color: #cbd5e1;
        }
        .status-item span {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
        }
        .buff-info {
            font-size: 11px;
            color: #fbbf24;
            margin-top: 3px;
        }
        .battle-log {
            background: #0f172a;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
            height: 130px;
            overflow-y: auto;
            font-size: 12px;
            color: #e2e8f0;
            margin-bottom: 15px;
            line-height: 1.5;
            font-family: monospace;
        }
        .card-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .card {
            background: #2563eb;
            color: white;
            padding: 12px;
            border-radius: 10px;
            width: 125px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #60a5fa;
        }
        .card:hover {
            transform: translateY(-5px);
            background: #1d4ed8;
        }
        .card.attack { background: #dc2626; border-color: #f87171; }
        .card.attack:hover { background: #b91c1c; }
        .card.heal { background: #16a34a; border-color: #4ade80; }
        .card.heal:hover { background: #15803d; }
        .card.special { background: #9333ea; border-color: #c084fc; }
        .card.special:hover { background: #7e22ce; }
        .card h3 { margin: 0 0 6px 0; font-size: 14px; }
        .card p { margin: 0; font-size: 10px; color: #f1f5f9; }
        .btn-reset { display: block; width: 100%; padding: 12px; background: #059669; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-reset:hover { background: #047857; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 16px; max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; border: 1px solid #475569; box-shadow: 0 15px 30px rgba(0,0,0,0.6); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .modal-header h2 { margin: 0; color: #38bdf8; font-size: 20px; }
        .btn-close { background: #ef4444; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .compendium-section { margin-bottom: 20px; }
        .compendium-section h3 { font-size: 15px; margin-bottom: 8px; color: #fbbf24; border-left: 3px solid #fbbf24; padding-left: 8px; }
        .compendium-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
        .compendium-card { background: #334155; padding: 10px; border-radius: 8px; font-size: 12px; border: 1px solid #475569; }
        .compendium-card b { display: block; margin-bottom: 4px; color: #38bdf8; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <h1>⚔️ 萌寵冒險：進階策略卡牌對決</h1>
        <button class="btn-info" onclick="toggleCompendium()">ℹ️ 卡牌圖鑑</button>
    </div>
    <div class="desc">運用策略卡牌與戰術組合，擊敗強大的魔王！</div>
    <div class="battlefield-banner" id="battlefield-banner">戰場載入中...</div>
    <div class="status-panel">
        <div class="status-item">玩家血量 (HP)<span id="player-hp">100</span><div class="buff-info" id="player-buff">狀態：正常</div></div>
        <div class="status-item">魔王血量 (HP)<span id="monster-hp">120</span><div class="buff-info" id="monster-buff">狀態：正常</div></div>
        <div class="status-item">當前回合數<span id="turn-count">1</span><div class="buff-info" id="action-points">剩餘行動：1</div></div>
    </div>
    <div class="battle-log" id="log-box">[系統] 戰鬥準備中...<br></div>
    <div class="card-container" id="card-selection"></div>
    <button class="btn-reset" id="reset-btn" onclick="initGame()" style="display:none;">重新開始冒險</button>
</div>

<div class="modal-overlay" id="compendium-modal">
    <div class="modal-content">
        <div class="modal-header"><h2>📖 遊戲卡牌圖鑑</h2><button class="btn-close" onclick="toggleCompendium()">關閉</button></div>
        <div id="compendium-body"></div>
    </div>
</div>

<script>
    let playerHP = 100;
    let monsterHP = 120;
    let maxMonsterHP = 120;
    let turn = 1;
    let gameOver = false;
    let actionsLeft = 1;

    let playerShield = 0;
    let monsterPoison = 0;
    let monsterHealBlocked = 0;
    let playerAtkBuff = 0; 
    let playerReflectActive = false;

    const battlefieldModifiers = [
        { name: "✨ 雙倍協奏：雙方每回合皆可連續進行 2 次行動！", effect: "double_action" },
        { name: "🔥 狂暴磁場：雙方攻擊傷害增加 30%，但每回合結束雙方扣除 5 點血量", effect: "berserk" },
        { name: "💧 治療枯竭：雙方所有回血效果減少 50%", effect: "weak_heal" },
        { name: "🛡️ 鐵壁防線：雙方初始獲得 20 點護盾", effect: "iron_wall" }
    ];
    let currentModifier = null;

    const cardPool = [
        { id: 1, name: "小火狐烈焰", type: "attack", subType: "normal", category: "攻擊型", value: 18, desc: "造成 18 點固定烈焰傷害。" },
        { id: 2, name: "嗜血猛擊", type: "attack", subType: "lifesteal", category: "攻擊型", value: 14, healVal: 7, desc: "造成 14 點傷害，並吸取 7 點生命值。" },
        { id: 3, name: "暴擊雷電", type: "attack", subType: "crit", category: "攻擊型", value: 26, desc: "40% 機率爆擊造成 26 點高傷害，否則僅造成 10 點。" },
        { id: 4, name: "劇毒飛刀", type: "attack", subType: "poison", category: "攻擊型", value: 10, desc: "造成 10 點傷害，使對手中毒 3 回合（每回合固定扣 6 點血）。" },
        { id: 5, name: "瞬間大回復", type: "heal", subType: "burst", category: "回復防禦型", value: 24, desc: "瞬間恢復 24 點生命值。" },
        { id: 6, name: "聖光護盾", type: "heal", subType: "shield", category: "回復防禦型", value: 12, shieldVal: 15, desc: "恢復 12 點生命並獲得 15 點護盾值。" },
        { id: 7, name: "血之狂熱", type: "special", subType: "sacrifice", category: "特殊戰術型", value: 18, costHP: 10, buffVal: 15, desc: "犧牲 10 點自身血量，下回合攻擊傷害固定 +15 點！" },
        { id: 8, name: "禁錮咒語", type: "special", subType: "antiheal", category: "特殊戰術型", value: 0, desc: "封鎖對手 2 回合內無法自我修復回血。" },
        { id: 9, name: "反彈護鏡", type: "special", subType: "reflect", category: "特殊戰術型", value: 0, desc: "獲得 10 點護盾。若下一回合生命受到魔王傷害，反彈該傷害的 50% 給魔王。" }
    ];

    function initGame() {
        playerHP = 100;
        monsterHP = 120;
        turn = 1;
        gameOver = false;
        playerShield = 0;
        monsterPoison = 0;
        monsterHealBlocked = 0;
        playerAtkBuff = 0;
        playerReflectActive = false;

        currentModifier = battlefieldModifiers[Math.floor(Math.random() * battlefieldModifiers.length)];
        document.getElementById("battlefield-banner").innerText = `當前戰場效果：${currentModifier.name}`;

        if (currentModifier.effect === "iron_wall") { playerShield = 20; }
        document.getElementById("reset-btn").style.display = "none";
        
        const logBox = document.getElementById("log-box");
        logBox.innerHTML = "";
        logMessage("<b>[系統] 戰鬥正式開始，迎接全新挑戰！</b>");
        
        updateStatus();
        startNewTurn();
        buildCompendiumUI();
    }

    function buildCompendiumUI() {
        const body = document.getElementById("compendium-body");
        body.innerHTML = "";
        const categories = ["攻擊型", "回復防禦型", "特殊戰術型"];
        categories.forEach(cat => {
            let section = document.createElement("div"); 
            section.className = "compendium-section"; 
            section.innerHTML = `<h3>${cat}</h3>`;
            
            let grid = document.createElement("div"); 
            grid.className = "compendium-grid";
            
            cardPool.filter(c => c.category === cat).forEach(card => {
                let cardEl = document.createElement("div"); 
                cardEl.className = "compendium-card"; 
                cardEl.innerHTML = `<b>${card.name}</b><p>${card.desc}</p>`;
                grid.appendChild(cardEl);
            });
            section.appendChild(grid); 
            body.appendChild(section);
        });
    }

    function toggleCompendium() {
        const modal = document.getElementById("compendium-modal");
        modal.style.display = (modal.style.display === "flex") ? "none" : "flex";
    }

    function startNewTurn() {
        if (gameOver) return;
        actionsLeft = (currentModifier.effect === "double_action") ? 2 : 1;
        if (monsterPoison > 0) { monsterHP -= 6; monsterPoison--; logMessage(`☠️ 魔王受到劇毒侵蝕，持續扣除 6 點血量！`); }
        if (currentModifier.effect === "berserk") { playerHP -= 5; monsterHP -= 5; logMessage(`🔥 狂暴磁場生效：雙方各自承受 5 點環境扣血！`); }
        if (checkWinLoss()) return;
        updateStatus();
        renderCards();
    }

    function updateStatus() {
        document.getElementById("player-hp").innerText = playerHP > 0 ? playerHP : 0;
        document.getElementById("monster-hp").innerText = monsterHP > 0 ? monsterHP : 0;
        document.getElementById("turn-count").innerText = turn;
        document.getElementById("action-points").innerText = `剩餘行動：${actionsLeft}`;
        
        let playerBuffText = `護盾：${playerShield}`;
        if (playerAtkBuff > 0) playerBuffText += ` | 攻擊強化(+${playerAtkBuff})`;
        if (playerReflectActive) playerBuffText += ` | 護鏡啟用`;
        document.getElementById("player-buff").innerText = playerBuffText;
        
        let monsterBuffText = "狀態：正常";
        if (monsterPoison > 0) monsterBuffText = `中毒(${monsterPoison}T)`;
        if (monsterHealBlocked > 0) monsterBuffText += ` | 禁回血`;
        document.getElementById("monster-buff").innerText = monsterBuffText;
    }

    function logMessage(msg) {
        const logBox = document.getElementById("log-box");
        logBox.innerHTML += msg + "<br>";
        logBox.scrollTop = logBox.scrollHeight;
    }

    function renderCards() {
        if (gameOver) return;
        const container = document.getElementById("card-selection"); 
        container.innerHTML = "";
        let shuffled = [...cardPool].sort(() => 0.5 - Math.random());
        shuffled.slice(0, 3).forEach(card => {
            let cardDiv = document.createElement("div"); 
            cardDiv.className = `card ${card.type}`; 
            cardDiv.innerHTML = `<h3>${card.name}</h3><p>${card.desc}</p>`;
            cardDiv.onclick = () => playCard(card); 
            container.appendChild(cardDiv);
        });
    }

    function playCard(card) {
        if (gameOver || actionsLeft <= 0) return;
        let dmgMultiplier = (currentModifier.effect === "berserk") ? 1.3 : 1.0;

        if (card.type === "attack") {
            let finalDmg = card.value;
            if (card.subType === "crit") { 
                let isCrit = Math.random() < 0.4; 
                finalDmg = isCrit ? 26 : 10; 
                logMessage(`⚡ 暴擊判定：${isCrit ? "成功爆擊！" : "普通命中。"}`); 
            }
            if (playerAtkBuff > 0) { 
                finalDmg += playerAtkBuff; 
                playerAtkBuff = 0; 
            }
            finalDmg = Math.round(finalDmg * dmgMultiplier);
            monsterHP -= finalDmg; 
            logMessage(`第 ${turn} 回合：你使用了 <b>${card.name}</b>，對魔王造成了 <b style="color:#f87171;">${finalDmg}</b> 點傷害！`);
            
            if (card.subType === "lifesteal") { 
                let healAmount = (currentModifier.effect === "weak_heal") ? Math.floor(7 / 2) : 7; 
                playerHP = Math.min(100, playerHP + healAmount); 
                logMessage(`✨ 吸血生效：你額外回復了 ${healAmount} 點生命值。`); 
            }
            else if (card.subType === "poison") { 
                monsterPoison = 3; 
                logMessage(`🧪 劇毒命中：魔王已中毒，將持續 3 回合扣血！`); 
            }
        } 
        else if (card.type === "heal") {
            let healAmount = (currentModifier.effect === "weak_heal") ? Math.floor(card.value / 2) : card.value;
            playerHP = Math.min(100, playerHP + healAmount); 
            logMessage(`第 ${turn} 回合：你使用了 <b>${card.name}</b>，回復了 <b style="color:#4ade80;">${healAmount}</b> 點生命！`);
            if (card.subType === "shield") { 
                playerShield += card.shieldVal; 
                logMessage(`🛡️ 獲得額外護盾 +${card.shieldVal} 點！`); 
            }
        } 
        else if (card.type === "special") {
            if (card.subType === "sacrifice") { 
                playerHP -= card.costHP; 
                playerAtkBuff = card.buffVal; 
                logMessage(`🩸 血之狂熱：你犧牲了 ${card.costHP} 點血量，下一次攻擊傷害將直接增加 <b style="color:#fbbf24;">+${card.buffVal}</b> 點！`); 
            }
            else if (card.subType === "antiheal") { 
                monsterHealBlocked = 2; 
                logMessage(`🔒 禁錮咒語：成功封鎖魔王 2 回合內的自我修復能力！`); 
            }
            else if (card.subType === "reflect") { 
                playerShield += 10; 
                playerReflectActive = true; 
                logMessage(`🛡️ 獲得 10 點防禦護盾，並準備在下回合反彈生命受到的傷害！`); 
            }
        }
        actionsLeft--; 
        updateStatus();
        if (checkWinLoss()) return;
        if (actionsLeft > 0) { 
            renderCards(); 
        } else { 
            setTimeout(monsterTurn, 600); 
        }
    }

    function monsterTurn() {
        if (gameOver) return;
        let monsterActions = (currentModifier.effect === "double_action") ? 2 : 1;
        logMessage(`--- <b>魔王反擊回合${monsterActions > 1 ? "（連續行動 2 次）" : ""}</b> ---`);

        for (let i = 0; i < monsterActions; i++) {
            if (gameOver) break;
            if (monsterHP < 60 && monsterHealBlocked <= 0 && Math.random() < 0.5) {
                let monsterHeal = (currentModifier.effect === "weak_heal") ? 10 : 20;
                monsterHP = Math.min(maxMonsterHP, monsterHP + monsterHeal); 
                logMessage(`🪄 魔王施展「自我修復」，回復了 ${monsterHeal} 點生命值！`);
            } else {
                let rawMonsterDmg = Math.floor(Math.random() * 11) + 12;
                if (currentModifier.effect === "berserk") rawMonsterDmg = Math.round(rawMonsterDmg * 1.3);

                let damageToPlayerBody = rawMonsterDmg;
                
                if (playerShield > 0) {
                    if (playerShield >= damageToPlayerBody) {
                        playerShield -= damageToPlayerBody; 
                        damageToPlayerBody = 0; 
                        logMessage(`🛡️ 護盾完全擋下了魔王的攻擊！`);
                    } else {
                        damageToPlayerBody -= playerShield; 
                        playerShield = 0; 
                        logMessage(`🛡️ 護盾被擊碎，剩餘傷害突破防線！`);
                    }
                }

                playerHP -= damageToPlayerBody;
                logMessage(`⚠️ 魔王發動猛擊，對你造成了 <b style="color:#f87171;">${damageToPlayerBody}</b> 點生命傷害。`);

                if (playerReflectActive && damageToPlayerBody > 0) {
                    let reflectedDmg = Math.round(damageToPlayerBody * 0.5);
                    monsterHP -= reflectedDmg;
                    logMessage(`🔄 <b>鏡面反射生效！將生命受到傷害的 50%（${reflectedDmg} 點）反彈給魔王！</b>`);
                }
            }
            if (checkWinLoss()) return;
        }

        if (monsterHealBlocked > 0) monsterHealBlocked--;
        playerReflectActive = false; 

        turn++; 
        updateStatus(); 
        startNewTurn();
    }

    function checkWinLoss() {
        if (monsterHP <= 0) { monsterHP = 0; updateStatus(); logMessage("🎉 <b>太強了！你成功擊敗了進階魔王！</b>"); endGame(); return true; }
        if (playerHP <= 0) { playerHP = 0; updateStatus(); logMessage("❌ <b>冒險失敗：你的生命值歸零。</b>"); endGame(); return true; }
        return false;
    }

    function endGame() { 
        gameOver = true; 
        document.getElementById("card-selection").innerHTML = ""; 
        document.getElementById("reset-btn").style.display = "block"; 
    }

    window.onload = initGame;
</script>
</body>
</html>
