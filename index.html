<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萌寵冒險：進階策略卡牌對決</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 750px;
            width: 100%;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            position: relative;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        h1 {
            color: #38bdf8;
            margin: 0;
            font-size: 24px;
        }
        .btn-info {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.2s;
        }
        .btn-info:hover {
            background: #0284c7;
        }
        .desc {
            color: #94a3b8;
            margin-bottom: 15px;
            font-size: 13px;
        }
        /* 戰場狀態提示條 */
        .battlefield-banner {
            background: #0284c7;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        /* 狀態面板 */
        .status-panel {
            display: flex;
            justify-content: space-around;
            background: #334155;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .status-item {
            text-align: center;
            font-size: 13px;
            color: #cbd5e1;
        }
        .status-item span {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
        }
        .buff-info {
            font-size: 11px;
            color: #fbbf24;
            margin-top: 3px;
        }
        /* 戰鬥日誌 */
        .battle-log {
            background: #0f172a;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
            height: 130px;
            overflow-y: auto;
            font-size: 12px;
            color: #e2e8f0;
            margin-bottom: 15px;
            line-height: 1.5;
            font-family: monospace;
        }
        /* 卡牌選擇區 */
        .card-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .card {
            background: #2563eb;
            color: white;
            padding: 12px;
            border-radius: 10px;
            width: 125px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #60a5fa;
        }
        .card:hover {
            transform: translateY(-5px);
            background: #1d4ed8;
        }
        .card.attack { background: #dc2626; border-color: #f87171; }
        .card.attack:hover { background: #b91c1c; }
        .card.heal { background: #16a34a; border-color: #4ade80; }
        .card.heal:hover { background: #15803d; }
        .card.special { background: #9333ea; border-color: #c084fc; }
        .card.special:hover { background: #7e22ce; }
        
        .card h3 {
            margin: 0 0 6px 0;
            font-size: 14px;
        }
        .card p {
            margin: 0;
            font-size: 10px;
            color: #f1f5f9;
        }
        .btn-reset {
            display: block;
            width: 100%;
            padding: 12px;
            background: #059669;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-reset:hover {
            background: #047857;
        }

        /* 彈跳視窗（圖鑑樣式） */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid #475569;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .modal-header h2 {
            margin: 0;
            color: #38bdf8;
            font-size: 20px;
        }
        .btn-close {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .compendium-section {
            margin-bottom: 20px;
        }
        .compendium-section h3 {
            font-size: 15px;
            margin-bottom: 8px;
            color: #fbbf24;
            border-left: 3px solid #fbbf24;
            padding-left: 8px;
        }
        .compendium-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }
        .compendium-card {
            background: #334155;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            border: 1px solid #475569;
        }
        .compendium-card b {
            display: block;
            margin-bottom: 4px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <h1>⚔️ 萌寵冒險：進階策略卡牌對決</h1>
        <button class="btn-info" onclick="toggleCompendium()">ℹ️ 卡牌圖鑑</button>
    </div>
    <div class="desc">運用攻擊、回復與戰術特殊卡，戰勝具備智慧反擊與雙倍行動機制的魔王！</div>

    <!-- 戰場隨機效果提示 -->
    <div class="battlefield-banner" id="battlefield-banner">
        戰場載入中...
    </div>

    <!-- 狀態面板 -->
    <div class="status-panel">
        <div class="status-item">玩家血量 (HP)<span id="player-hp">100</span><div class="buff-info" id="player-buff">狀態：正常</div></div>
        <div class="status-item">魔王血量 (HP)<span id="monster-hp">120</span><div class="buff-info" id="monster-buff">狀態：正常</div></div>
        <div class="status-item">當前回合數<span id="turn-count">1</span><div class="buff-info" id="action-points">剩餘行動：1</div></div>
    </div>

    <!-- 戰鬥日誌 -->
    <div class="battle-log" id="log-box">
        [系統] 戰鬥展開！請選擇你的卡牌...<br>
    </div>

    <!-- 卡牌選擇區 -->
    <div class="card-container" id="card-selection"></div>

    <!-- 重新開始按鈕 -->
    <button class="btn-reset" id="reset-btn" onclick="initGame()" style="display:none;">重新開始冒險</button>
</div>

<!-- 卡牌圖鑑彈跳視窗 -->
<div class="modal-overlay" id="compendium-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>📖 遊戲卡牌圖鑑</h2>
            <button class="btn-close" onclick="toggleCompendium()">關閉</button>
        </div>
        <div id="compendium-body">
            <!-- 動態填入圖鑑內容 -->
        </div>
    </div>
</div>

<script>
    let playerHP = 100;
    let monsterHP = 120;
    let maxMonsterHP = 120;
    let turn = 1;
    let gameOver = false;
    let actionsLeft = 1;

    let playerShield = 0;
    let monsterPoison = 0;
    let monsterHealBlocked = 0;
    let playerAtkBuff = 0; // 記錄增加的攻擊數值 (+15)

    const battlefieldModifiers = [
        { name: "✨ 雙倍協奏：雙方每回合皆可連續進行 2 次行動！", effect: "double_action" },
        { name: "🔥 狂暴磁場：雙方攻擊傷害增加 30%，但每回合結束雙方扣除 5 點血量", effect: "berserk" },
        { name: "💧 治療枯竭：雙方所有回血效果減少 50%", effect: "weak_heal" },
        { name: "🛡️ 鐵壁防線：雙方初始獲得 20 點護盾", effect: "iron_wall" }
    ];
    let currentModifier = null;

    // 更新後的卡牌資料庫（數值與敘述更明確）
    const cardPool = [
        // 攻擊型
        { id: 1, name: "小火狐烈焰", type: "attack", subType: "normal", category: "攻擊型", value: 18, desc: "造成 18 點固定烈焰傷害。" },
        { id: 2, name: "嗜血猛擊", type: "attack", subType: "lifesteal", category: "攻擊型", value: 14, healVal: 7, desc: "造成 14 點傷害，並吸取 7 點生命值。" },
        { id: 3, name: "暴擊雷電", type: "attack", subType: "crit", category: "攻擊型", value: 26, desc: "40% 機率爆擊造成 26 點高傷害，否則僅造成 10 點。" },
        { id: 4, name: "劇毒飛刀", type: "attack", subType: "poison", category: "攻擊型", value: 10, desc: "造成 10 點傷害，使對手中毒 3 回合（每回合固定扣 6 點血）。" },
        
        // 回復與防禦型
        { id: 5, name: "瞬間大回復", type: "heal", subType: "burst", category: "回復防禦型", value: 24, desc: "瞬間恢復 24 點生命值。" },
        { id: 6, name: "聖光護盾", type: "heal", subType: "shield", category: "回復防禦型", value: 12, shieldVal: 15, desc: "恢復 12 點生命並獲得 15 點護盾值。" },
        
        // 特殊戰術型
        { id: 7, name: "血之狂熱", type: "special", subType: "sacrifice", category: "特殊戰術型", value: 18, costHP: 10, buffVal: 15, desc: "犧牲 10 點自身血量，下回合攻擊傷害固定 +15 點！" },
        { id: 8, name: "禁錮咒語", type: "special", subType: "antiheal", category: "特殊戰術型", value: 0, desc: "封鎖對手 2 回合內無法自我修復回血。" },
        { id: 9, name: "反彈護鏡", type: "special", subType: "reflect", category: "特殊戰術型", value: 0, desc: "獲得 10 點護盾，並準備抵擋與減免傷害。" }
    ];

    function initGame() {
        playerHP = 100;
        monsterHP = 120;
        turn = 1;
        gameOver = false;
        playerShield = 0;
        monsterPoison = 0;
        monsterHealBlocked = 0;
        playerAtkBuff = 0;

        currentModifier = battlefieldModifiers[Math.floor(Math.random() * battlefieldModifiers.length)];
        document.getElementById("battlefield-banner").innerText = `當前戰場效果：${currentModifier.name}`;

        if (currentModifier.effect === "iron_wall") {
            playerShield = 20;
        }

        document.getElementById("reset-btn").style.display = "none";
        logMessage("<b>[系統] 戰鬥正式開始，迎接全新挑戰！</b>");
        updateStatus();
        startNewTurn();
        buildCompendiumUI();
    }

    // 建立卡牌圖鑑內容
    function buildCompendiumUI() {
        const body = document.getElementById("compendium-body");
        body.innerHTML = "";

        const categories = ["攻擊型", "回復防禦型", "特殊戰術型"];
        categories.forEach(cat => {
            let section = document.createElement("div");
            section.className = "compendium-section";
            section.innerHTML = `<h3>${cat}</h3>`;
            
            let grid = document.createElement("div");
            grid.className = "compendium-grid";

            cardPool.filter(c => c.category === cat).forEach(card => {
                let cardEl = document.createElement("div");
                cardEl.className = "compendium-card";
                cardEl.innerHTML = `<b>${card.name}</b><p>${card.desc}</p>`;
                grid.appendChild(cardEl);
            });

            section.appendChild(grid);
            body.appendChild(section);
        });
    }

    function toggleCompendium() {
        const modal = document.getElementById("compendium-modal");
        modal.style.display = (modal.style.display === "flex") ? "none" : "flex";
    }

    function startNewTurn() {
        if (gameOver) return;

        actionsLeft = (currentModifier.effect === "double_action") ? 2 : 1;

        if (monsterPoison > 0) {
            let poisonDmg = 6;
            monsterHP -= poisonDmg;
            monsterPoison--;
            logMessage(`☠️ 魔王受到劇毒侵蝕，持續扣除 ${poisonDmg} 點血量！`);
        }

        if (currentModifier.effect === "berserk") {
            playerHP -= 5;
            monsterHP -= 5;
            logMessage(`🔥 狂暴磁場生效：雙方各自承受 5 點環境扣血！`);
        }

        if (checkWinLoss()) return;
        updateStatus();
        renderCards();
    }

    function updateStatus() {
        document.getElementById("player-hp").innerText = playerHP > 0 ? playerHP : 0;
        document.getElementById("monster-hp").innerText = monsterHP > 0 ? monsterHP : 0;
        document.getElementById("turn-count").innerText = turn;
        document.getElementById("action-points").innerText = `剩餘行動：${actionsLeft}`;

        let playerBuffText = `護盾：${playerShield}`;
        if (playerAtkBuff > 0) playerBuffText += ` | 攻擊強化(+${playerAtkBuff})`;
        document.getElementById("player-buff").innerText = playerBuffText;

        let monsterBuffText = "狀態：正常";
        if (monsterPoison > 0) monsterBuffText = `中毒(${monsterPoison}T)`;
        if (monsterHealBlocked > 0) monsterBuffText += ` | 禁回血`;
        document.getElementById("monster-buff").innerText = monsterBuffText;
    }

    function logMessage(msg) {
        const logBox = document.getElementById("log-box");
        logBox.innerHTML += msg + "<br>";
        logBox.scrollTop = logBox.scrollHeight;
    }

    function renderCards() {
        if (gameOver) return;
        const container = document.getElementById("card-selection");
        container.innerHTML = "";

        let shuffled = [...cardPool].sort(() => 0.5 - Math.random());
        let selectedCards = shuffled.slice(0, 3);

        selectedCards.forEach(card => {
            let cardDiv = document.createElement("div");
            cardDiv.className = `card ${card.type}`;
            cardDiv.innerHTML = `<h3>${card.name}</h3><p>${card.desc}</p>`;
            cardDiv.onclick = () => playCard(card);
            container.appendChild(cardDiv);
        });
    }

    function playCard(card) {
        if (gameOver || actionsLeft <= 0) return;

        let dmgMultiplier = (currentModifier.effect === "berserk") ? 1.3 : 1.0;

        if (card.type === "attack") {
            let finalDmg = card.value;
            if (card.subType === "crit") {
                let isCrit = Math.random() < 0.4;
                finalDmg = isCrit ? 26 : 10;
                logMessage(`⚡ 暴擊判定：${isCrit ? "成功爆擊！" : "普通命中。"}`);
            }
            
            if (playerAtkBuff > 0) {
                finalDmg += playerAtkBuff; // 加上明確的數值 (+15)
                playerAtkBuff = 0; 
            }

            finalDmg = Math.round(finalDmg * dmgMultiplier);
            monsterHP -= finalDmg;
            logMessage(`第 ${turn} 回合：你使用了 <b>${card.name}</b>，對魔王造成了 <b style="color:#f87171;">${finalDmg}</b> 點傷害！`);

            if (card.subType === "lifesteal") {
                let healAmount = card.healVal;
                if (currentModifier.effect === "weak_heal") healAmount = Math.floor(healAmount / 2);
                playerHP += healAmount;
                if (playerHP > 100) playerHP = 100;
                logMessage(`✨ 吸血生效：你額外回復了 ${healAmount} 點生命值。`);
            } else if (card.subType === "poison") {
                monsterPoison = 3;
                logMessage(`🧪 劇毒命中：魔王已中毒，將持續 3 回合扣血！`);
            }
        } 
        else if (card.type === "heal") {
            let healAmount = card.value;
            if (currentModifier.effect === "weak_heal") {
                healAmount = Math.floor(healAmount / 2);
                logMessage(`⚠️ 戰場效果「治療枯竭」生效：回復效果減半！`);
            }

            playerHP += healAmount;
            if (playerHP > 100) playerHP = 100;
            logMessage(`第 ${turn} 回合：你使用了 <b>${card.name}</b>，回復了 <b style="color:#4ade80;">${healAmount}</b> 點生命！`);

            if (card.subType === "shield") {
                playerShield += card.shieldVal;
                logMessage(`🛡️ 獲得額外護盾 +${card.shieldVal} 點！`);
            }
        } 
        else if (card.type === "special") {
            if (card.subType === "sacrifice") {
                playerHP -= card.costHP;
                playerAtkBuff = card.buffVal; // 設定為明確的 15
                logMessage(`🩸 血之狂熱：你犧牲了 ${card.costHP} 點血量，下一次攻擊傷害將直接增加 <b style="color:#fbbf24;">+${card.buffVal}</b> 點！`);
            } else if (card.subType === "antiheal") {
                monsterHealBlocked = 2;
                logMessage(`🔒 禁錮咒語：成功封鎖魔王 2 回合內的自我修復能力！`);
            } else if (card.subType === "reflect") {
                playerShield += 10;
                logMessage(`🛡️ 獲得 10 點防禦護盾！`);
            }
        }

        actionsLeft--;
        updateStatus();

        if (checkWinLoss()) return;

        if (actionsLeft > 0) {
            logMessage(`✨ 享有額外行動機會，請選擇下一張卡牌！`);
            renderCards();
        } else {
            setTimeout(monsterTurn, 600);
        }
    }

    // 魔王 AI 回合（支援雙倍協奏，魔王也會行動兩次）
    function monsterTurn() {
        if (gameOver) return;

        let monsterActions = (currentModifier.effect === "double_action") ? 2 : 1;
        if (monsterActions > 1) {
            logMessage(`--- <b>魔王反擊回合（雙倍協奏：魔王連續行動 2 次！）</b> ---`);
        } else {
            logMessage(`--- <b>魔王反擊回合</b> ---`);
        }

        for (let i = 0; i < monsterActions; i++) {
            if (gameOver) break;

            // 魔王 AI 決策：血量低於 50% 且未被禁錮時，有機會自我修復
            if (monsterHP < 60 && monsterHealBlocked <= 0 && Math.random() < 0.5) {
                let monsterHeal = 20;
                if (currentModifier.effect === "weak_heal") monsterHeal = 10;
                monsterHP += monsterHeal;
                if (monsterHP > maxMonsterHP) monsterHP = maxMonsterHP;
                logMessage(`🪄 魔王施展「自我修復」，成功回復了 ${monsterHeal} 點生命值！`);
            } else {
                let rawMonsterDmg = Math.floor(Math.random() * 11) + 12;
                if (currentModifier.effect === "berserk") rawMonsterDmg = Math.round(rawMonsterDmg * 1.3);

                if (playerShield > 0) {
                    if (playerShield >= rawMonsterDmg) {
                        playerShield -= rawMonsterDmg;
                        rawMonsterDmg = 0;
                        logMessage(`🛡️ 護盾完全擋下了魔王的攻擊！`);
                    } else {
                        rawMonsterDmg -= playerShield;
                        playerShield = 0;
                        logMessage(`🛡️ 護盾被擊碎，剩餘傷害突破防線！`);
                    }
                }

                playerHP -= rawMonsterDmg;
                logMessage(`⚠️ 魔王發動猛擊，造成了 <b style="color:#f87171;">${rawMonsterDmg}</b> 點傷害。`);
            }

            if (checkWinLoss()) return;
        }

        if (monsterHealBlocked > 0) monsterHealBlocked--;

        turn++;
        updateStatus();
        startNewTurn();
    }

    function checkWinLoss() {
        if (monsterHP <= 0) {
            monsterHP = 0;
            updateStatus();
            logMessage("🎉 <b>太強了！你成功擊敗了進階魔王，完美達成策略挑戰！</b>");
            endGame();
            return true;
        }
        if (playerHP <= 0) {
            playerHP = 0;
            updateStatus();
            logMessage("❌ <b>冒險失敗：你的生命值歸零。請點擊下方按鈕重新挑戰！</b>");
            endGame();
            return true;
        }
        return false;
    }

    function endGame() {
        gameOver = true;
        document.getElementById("card-selection").innerHTML = "";
        document.getElementById("reset-btn").style.display = "block";
    }

    window.onload = initGame;
</script>

</body>
</html>
