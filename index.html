<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萌寵冒險：進階策略對決</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #f8fafc; margin: 0; padding: 20px;
        display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .container {
        max-width: 820px; width: 100%; background: #1e293b; padding: 25px;
        border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border: 1px solid #334155;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 10px; }
    h1 { color: #38bdf8; margin: 0; font-size: 22px; }
    .header-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-info {
        color: white; border: none; padding: 6px 10px; border-radius: 6px;
        cursor: pointer; font-weight: bold; font-size: 12px; transition: background 0.2s;
    }
    .btn-info:hover { filter: brightness(1.15); }
    .btn-hero { background: #10b981; }
    .btn-tutorial { background: #f59e0b; color: #0f172a; }
    .btn-battlefield { background: #8b5cf6; }
    .btn-boss { background: #ef4444; }
    .btn-current-boss { background: #6366f1; }
    .btn-setup { background: #475569; }
    .btn-info.btn-blue { background: #0ea5e9; }

    .desc { color: #94a3b8; margin-bottom: 15px; font-size: 13px; }
    .battlefield-banner {
        background: #0284c7; color: white; padding: 10px; border-radius: 8px;
        text-align: center; font-weight: bold; font-size: 13px; margin-bottom: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .tutorial-banner {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: #0f172a; padding: 12px; border-radius: 8px; font-size: 13px;
        font-weight: bold; margin-bottom: 12px; display: flex;
        justify-content: space-between; align-items: center; gap: 8px;
        box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
    }
    .btn-skip-tutorial {
        background: #0f172a; color: #f59e0b; border: 1px solid #f59e0b;
        padding: 4px 10px; border-radius: 6px; cursor: pointer;
        font-size: 11px; font-weight: bold; white-space: nowrap;
    }
    .status-panel {
        display: flex; justify-content: space-around; background: #334155;
        padding: 12px; border-radius: 10px; margin-bottom: 12px; gap: 8px;
    }
    .status-item { text-align: center; font-size: 12px; color: #cbd5e1; flex: 1; }
    .status-item .status-value { display: block; font-size: 18px; font-weight: bold; color: #38bdf8; margin: 2px 0; }
    .status-item .status-label { font-size: 11px; color: #94a3b8; }
    .buff-info { font-size: 10px; color: #fbbf24; margin-top: 4px; min-height: 18px; }
    .status-icon {
        display: inline-block; padding: 2px 6px; border-radius: 4px;
        font-size: 10px; margin: 1px; font-weight: bold; background: #475569;
    }
    .status-icon.shield { background: #1e40af; }
    .status-icon.atk { background: #7c2d12; }
    .status-icon.reflect { background: #6b21a8; }
    .status-icon.regen { background: #166534; }
    .status-icon.warn { background: #854d0e; }
    .status-icon.poison { background: #4c1d95; }
    .status-icon.lock { background: #713f12; }
    .status-icon.frost { background: #0e7490; }
    .status-icon.rage { background: #b91c1c; }

    .battle-log {
        background: #0f172a; border: 1px solid #475569; padding: 12px;
        border-radius: 8px; height: 180px; overflow-y: auto; font-size: 12px;
        color: #e2e8f0; margin-bottom: 12px; line-height: 1.55; font-family: monospace;
    }
    .log-line { padding: 2px 0; }
    .log-dmg { color: #fca5a5; }
    .log-heal { color: #86efac; }
    .log-shield { color: #93c5fd; }
    .log-status { color: #fcd34d; }
    .log-crit { color: #fbbf24; font-weight: bold; }
    .log-info { color: #cbd5e1; }
    .log-warn { color: #fbbf24; }
    .log-player-turn {
        color: #38bdf8; font-weight: bold; background: rgba(56, 189, 248, 0.1);
        border-left: 3px solid #38bdf8; padding: 4px 8px; margin: 8px 0 4px;
        border-radius: 0 4px 4px 0;
    }
    .log-monster-turn {
        color: #f87171; font-weight: bold; background: rgba(248, 113, 113, 0.1);
        border-left: 3px solid #f87171; padding: 4px 8px; margin: 8px 0 4px;
        border-radius: 0 4px 4px 0;
    }

    .card-container {
        display: flex; gap: 10px; justify-content: center;
        margin-bottom: 15px; flex-wrap: wrap; min-height: 170px;
    }
    .card {
        background: #2563eb; color: white; padding: 14px 10px 10px;
        border-radius: 10px; width: 130px; text-align: center; cursor: pointer;
        transition: transform 0.2s, background 0.2s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #60a5fa;
        position: relative;
    }
    .card.highlight { border: 2px solid #fbbf24; animation: pulse 1.5s infinite; }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
        100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
    }
    .card:hover { transform: translateY(-5px); filter: brightness(1.1); }
    .card.attack { background: #dc2626; border-color: #f87171; }
    .card.heal { background: #16a34a; border-color: #4ade80; }
    .card.special { background: #9333ea; border-color: #c084fc; }
    .card-type-badge {
        position: absolute; top: -8px; right: -6px;
        padding: 2px 8px; border-radius: 10px; font-size: 9px;
        font-weight: bold; background: #fbbf24; color: #0f172a;
    }
    .card.attack .card-type-badge { background: #fca5a5; color: #450a0a; }
    .card.heal .card-type-badge { background: #86efac; color: #052e16; }
    .card.special .card-type-badge { background: #d8b4fe; color: #2e1065; }
    .card h3 { margin: 4px 0; font-size: 13px; }
    .card-value { font-size: 18px; font-weight: bold; margin: 4px 0; color: #fef3c7; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    .card p { margin: 4px 0 0; font-size: 10px; color: #f1f5f9; line-height: 1.35; }

    .btn-reset {
        display: block; width: 100%; padding: 12px; background: #059669;
        color: white; border: none; border-radius: 8px; font-size: 16px;
        font-weight: bold; cursor: pointer; transition: background 0.2s;
    }
    .btn-reset:hover { background: #047857; }

    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.78); display: none;
        justify-content: center; align-items: center; z-index: 100; padding: 15px;
    }
    .modal-content {
        background: #1e293b; padding: 20px; border-radius: 16px;
        max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto;
        border: 1px solid #475569; box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    }
    .modal-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px;
    }
    .modal-header h2 { margin: 0; color: #38bdf8; font-size: 18px; }
    .btn-close {
        background: #ef4444; color: white; border: none; padding: 5px 12px;
        border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .setup-group { margin-bottom: 14px; }
    .setup-group label { display: block; font-size: 13px; color: #fbbf24; margin-bottom: 6px; font-weight: bold; }
    .setup-group select {
        width: 100%; padding: 9px; background: #0f172a; color: white;
        border: 1px solid #475569; border-radius: 8px; font-size: 13px;
    }
    .btn-start-battle {
        width: 100%; padding: 12px; background: #2563eb; color: white;
        border: none; border-radius: 8px; font-size: 15px; font-weight: bold;
        cursor: pointer; margin-top: 8px;
    }
    .btn-start-battle:hover { background: #1d4ed8; }

    .compendium-section { margin-bottom: 18px; }
    .compendium-section h3 { font-size: 14px; margin-bottom: 8px; padding-left: 8px; }
    .compendium-section h3.atk { color: #f87171; border-left: 3px solid #f87171; }
    .compendium-section h3.heal { color: #4ade80; border-left: 3px solid #4ade80; }
    .compendium-section h3.special { color: #c084fc; border-left: 3px solid #c084fc; }
    .compendium-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
    .compendium-card { background: #334155; padding: 9px; border-radius: 8px; font-size: 11px; border: 1px solid #475569; }
    .compendium-card b { display: block; margin-bottom: 3px; color: #38bdf8; font-size: 12px; }
    .compendium-card p { margin: 0; color: #cbd5e1; line-height: 1.4; }

    .effect-item {
        background: #334155; padding: 11px; border-radius: 8px;
        margin-bottom: 9px; border-left: 4px solid #8b5cf6;
    }
    .effect-item.hero-item { border-left-color: #10b981; }
    .effect-item.boss-item { border-left-color: #ef4444; }
    .effect-item.current-item { border-left-color: #f59e0b; }
    .effect-item b { font-size: 13px; display: block; margin-bottom: 4px; }
    .effect-item.hero-item b { color: #34d399; }
    .effect-item.boss-item b { color: #f87171; }
    .effect-item.current-item b { color: #fbbf24; }
    .effect-item p { margin: 0; font-size: 12px; color: #cbd5e1; line-height: 1.5; }
</style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <h1>⚔️ 萌寵冒險：進階策略對決</h1>
        <div class="header-buttons">
            <button class="btn-info btn-hero" onclick="toggleModal('hero-modal')">🐱 萌寵英雄</button>
            <button class="btn-info btn-tutorial" onclick="startTutorialStage()">🎓 實戰教學</button>
            <button class="btn-info btn-current-boss" onclick="toggleModal('current-boss-modal')">👁️ 當前魔王</button>
            <button class="btn-info btn-boss" onclick="toggleModal('boss-modal')">👹 魔王圖鑑</button>
            <button class="btn-info btn-battlefield" onclick="toggleModal('battlefield-modal')">⚡ 戰場效果</button>
            <button class="btn-info btn-blue" onclick="toggleModal('compendium-modal')">📖 卡牌圖鑑</button>
            <button class="btn-info btn-setup" onclick="openSetupModal()">⚙️ 自選配置</button>
        </div>
    </div>
    <div class="desc">選擇適合的萌寵英雄與卡牌策略，擊敗強大的魔王！</div>

    <div class="tutorial-banner" id="tutorial-banner" style="display:none;">
        <span id="tutorial-text">🎓 新手教學引導載入中...</span>
        <button class="btn-skip-tutorial" onclick="skipTutorial()">⏩ 略過</button>
    </div>

    <div class="battlefield-banner" id="battlefield-banner">戰場載入中...</div>
    <div class="status-panel">
        <div class="status-item">
            <span class="status-label" id="player-title-hp">英雄血量</span>
            <span class="status-value" id="player-hp">0 / 0</span>
            <div class="buff-info" id="player-buff">正常</div>
        </div>
        <div class="status-item">
            <span class="status-label" id="boss-title-hp">魔王血量</span>
            <span class="status-value" id="monster-hp">0 / 0</span>
            <div class="buff-info" id="monster-buff">正常</div>
        </div>
        <div class="status-item">
            <span class="status-label">當前回合</span>
            <span class="status-value" id="turn-count">1</span>
            <div class="buff-info" id="action-points">剩餘行動：1</div>
        </div>
    </div>
    <div class="battle-log" id="log-box">[系統] 戰鬥準備中...<br></div>
    <div class="card-container" id="card-selection"></div>
    <button class="btn-reset" id="reset-btn" onclick="startRandomGame()" style="display:none;">⚔️ 重新開始冒險（隨機）</button>
</div>

<!-- 自選配置 -->
<div class="modal-overlay" id="setup-modal">
    <div class="modal-content">
        <div class="modal-header"><h2>⚙️ 戰鬥自選配置</h2><button class="btn-close" onclick="toggleModal('setup-modal')">關閉</button></div>
        <div class="setup-group">
            <label>指定萌寵英雄：</label>
            <select id="hero-select">
                <option value="random">🎲 隨機決定</option>
                <option value="ignis">🔥 火狂小狐 (Ignis) - 爆發輸出型</option>
                <option value="turtlo">🛡️ 堅甲龜 (Turtlo) - 受傷反擊防禦型</option>
                <option value="shadow">🐱 影爪貓 (Shadow) - 異常毒傷型</option>
                <option value="thunder">⚡ 閃電鳥 (Thunder) - 麻痺控制型</option>
                <option value="copycat">🐰 複製兔 (Copycat) - 特殊卡複製型</option>
            </select>
        </div>
        <div class="setup-group">
            <label>指定挑戰魔王：</label>
            <select id="boss-select">
                <option value="random">🎲 隨機決定</option>
                <option value="standard">👹 深淵霸主（咆哮壓制型）</option>
                <option value="undying">☠️ 不死魔王·巴洛克（復活特化型）</option>
                <option value="evasion">🥷 幽影刺客·影魔（閃避特化型）</option>
                <option value="vampire">🧛 吸血鬼王·德古拉（吸血特化型）</option>
                <option value="guardian">🏰 鋼鐵要塞·蓋亞（護盾反震型）</option>
            </select>
        </div>
        <div class="setup-group">
            <label>指定戰場效果：</label>
            <select id="modifier-select">
                <option value="random">🎲 隨機決定</option>
                <option value="double_action">✨ 雙倍協奏（雙方每回合 2 次行動）</option>
                <option value="berserk">🔥 狂暴磁場（傷害+20%，每回合雙方 -4 血）</option>
                <option value="weak_heal">💧 治療枯竭（所有回復 -40%）</option>
                <option value="iron_wall">🛡️ 鐵壁防線（雙方開局 +20 護盾）</option>
                <option value="fog_choice">🌫️ 迷霧選擇（每回合僅 2 張卡可選）</option>
                <option value="thorns">🌵 荊棘之地（受攻擊反傷 3 點）</option>
                <option value="sacrifice_altar">🪦 獻祭祭壇（開戰雙方血量上限 -15）</option>
            </select>
        </div>
        <button class="btn-start-battle" onclick="startConfiguredGame()">套用指定配置並開戰！</button>
    </div>
</div>

<!-- 英雄彈窗 -->
<div class="modal-overlay" id="hero-modal">
    <div class="modal-content">
        <div class="modal-header"><h2>🐱 萌寵英雄天賦與列表</h2><button class="btn-close" onclick="toggleModal('hero-modal')">關閉</button></div>
        <div id="hero-body"></div>
    </div>
</div>

<!-- 當前魔王 -->
<div class="modal-overlay" id="current-boss-modal">
    <div class="modal-content">
        <div class="modal-header"><h2>👁️ 當前對決魔王詳細情報</h2><button class="btn-close" onclick="toggleModal('current-boss-modal')">關閉</button></div>
        <div id="current-boss-body"></div>
    </div>
</div>

<!-- 卡牌圖鑑 -->
<div class="modal-overlay" id="compendium-modal">
    <div class="modal-content">
        <div class="modal-header"><h2>📖 遊戲卡牌圖鑑</h2><button class="btn-close" onclick="toggleModal('compendium-modal')">關閉</button></div>
        <div id="compendium-body"></div>
    </div>
</div>

<!-- 戰場效果 -->
<div class="modal-overlay" id="battlefield-modal">
    <div class="modal-content">
        <div class="modal-header"><h2>⚡ 戰場效果總覽</h2><button class="btn-close" onclick="toggleModal('battlefield-modal')">關閉</button></div>
        <div id="battlefield-body"></div>
    </div>
</div>

<!-- 魔王圖鑑 -->
<div class="modal-overlay" id="boss-modal">
    <div class="modal-content">
        <div class="modal-header"><h2>👹 全魔王圖鑑與特性說明</h2><button class="btn-close" onclick="toggleModal('boss-modal')">關閉</button></div>
        <div id="boss-body"></div>
    </div>
</div>

<script>
/* ============================================================
   一、資料定義
   ============================================================ */
const heroes = [
    { id: "ignis", name: "火狂小狐 (Ignis)", hp: 92, trait: "ignis",
      desc: "【烈焰血脈】打出攻擊型卡牌時，30% 機率額外追加 +5 點烈焰傷害！" },
    { id: "turtlo", name: "堅甲龜 (Turtlo)", hp: 100, trait: "turtlo",
      desc: "【堅甲防禦】受傷時獲得 3 點護盾；所有護盾效果提升 +10%！" },
    { id: "shadow", name: "影爪貓 (Shadow)", hp: 100, trait: "shadow",
      desc: "【劇毒爪痕】對魔王造成的中毒與冰霜虛弱持續回合數額外 +1 回合！" },
    { id: "thunder", name: "閃電鳥 (Thunder)", hp: 90, trait: "thunder",
      desc: "【雷霆麻痺】每次攻擊命中時，15% 機率使魔王麻痺，額外跳過 1 次行動！" },
    { id: "copycat", name: "複製兔 (Copycat)", hp: 95, trait: "copycat",
      desc: "【鏡像複製】每場戰鬥第一次打出特殊戰術卡時，額外複製一次卡牌效果！" }
];

const bossTypes = [
    { id: "standard", name: "深淵霸主", hp: 120, trait: "standard",
      desc: "【咆哮壓制型】每 3 回合（第 3、6、9...回合）釋放【深淵咆哮】，造成 18 點傷害並施加【壓制】（玩家下回合僅 1 張卡可選）！" },
    { id: "undying", name: "不死魔王·巴洛克", hp: 100, trait: "undying",

    { id: "evasion", name: "幽影刺客·影魔", hp: 110, trait: "evasion",

    { id: "vampire", name: "吸血鬼王·德古拉", hp: 115, trait: "vampire",

    { id: "guardian", name: "鋼鐵要塞·蓋亞", hp: 120, trait: "guardian",
      desc: "【鋼鐵反震】護盾被玩家攻擊擊破的瞬間，對玩家造成 15 點真實傷害（無視護盾）！" }

const battlefieldModifiers = [
    { name: "✨ 雙倍協奏（雙方每回合 2 次行動）", effect: "double_action" },
    { name: "🔥 狂暴磁場（傷害+20%，每回合雙方 -4 血，無視護盾）", effect: "berserk" },
    { name: "💧 治療枯竭（所有回復 -40%）", effect: "weak_heal" },
    { name: "🛡️ 鐵壁防線（雙方開局 +20 護盾）", effect: "iron_wall" },
    { name: "🌫️ 迷霧選擇（每回合僅 2 張卡可選）", effect: "fog_choice" },
    { name: "🌵 荊棘之地（每次受攻擊，攻擊方反傷 3 點，無視護盾）", effect: "thorns" },
    { name: "🪦 獻祭祭壇（開戰雙方血量上限 -15）", effect: "sacrifice_altar" }
];

const cardPool = [
    { id: 1, name: "小火狐烈焰", type: "attack", subType: "normal", category: "攻擊型", value: 18,
      desc: "造成 18 點固定烈焰傷害。" },
    { id: 2, name: "嗜血猛擊", type: "attack", subType: "lifesteal", category: "攻擊型", value: 14, healVal: 7,
      desc: "造成 14 點傷害，並吸取 7 點生命（治療枯竭下為 4 點）。" },

/* ============================================================
   二、全域狀態
   ============================================================ */
let S = null;

function createState(hero, boss, mod, isTutorial = false) {
    const monsterHp = isTutorial ? 50 : boss.hp;
    const st = {
        hero, boss, mod,
        isTutorial,
        turn: 1, actionsLeft: 1, gameOver: false,
        bossRevived: false, heroTraitUsed: false,
        tutorialStep: 0,
        player: {
            hp: hero.hp, maxHp: hero.hp, shield: 0,
            atkBuff: 0, reflectActive: false, regenTurns: 0, suppressNext: false
        },
        monster: {
            hp: monsterHp, maxHp: isTutorial ? 50 : boss.hp, shield: 0,
            poison: 0, skipTurns: 0, weakTurns: 0, atkBuffTurns: 0
        }
    };
    if (mod.effect === "iron_wall") {
        st.player.shield = hero.trait === "turtlo" ? 22 : 20;
        st.monster.shield = 20;
    }
    if (mod.effect === "sacrifice_altar") {
        st.player.maxHp = Math.max(1, st.player.maxHp - 15);
        st.player.hp = Math.min(st.player.hp, st.player.maxHp);
        st.monster.maxHp = Math.max(1, st.monster.maxHp - 15);
        st.monster.hp = Math.min(st.monster.hp, st.monster.maxHp);
    }
    return st;
}

/* ============================================================
   三、工具函式
   ============================================================ */
function log(html, type = "info") {
    const box = document.getElementById("log-box");
    box.innerHTML += `<div class="log-line log-${type}">${html}</div>`;
    box.scrollTop = box.scrollHeight;
}
function logTurn(html, who) {
    const box = document.getElementById("log-box");
    box.innerHTML += `<div class="log-${who}-turn">${html}</div>`;
    box.scrollTop = box.scrollHeight;
}
function healModifier() { return S.mod.effect === "weak_heal" ? 0.6 : 1.0; }
function healPlayer(amount) {
    const actual = Math.round(amount * healModifier());
    S.player.hp = Math.min(S.player.maxHp, S.player.hp + actual);
    return actual;
}
function healMonster(amount) {
    const actual = Math.round(amount * healModifier());
    S.monster.hp = Math.min(S.monster.maxHp, S.monster.hp + actual);
    return actual;
}
function toggleModal(id) {
    const m = document.getElementById(id);
    m.style.display = m.style.display === "flex" ? "none" : "flex";
}
function openSetupModal() { document.getElementById("setup-modal").style.display = "flex"; }

/* ============================================================
   四、傷害管線
   ============================================================ */
function applyDamageToMonster(dmg, opts = {}) {
    const { ignoreShield = false, cardName = null, canEvade = true, fromPlayer = true } = opts;
    if (canEvade && S.boss.trait === "evasion" && Math.random() < 0.20) {
        log(`💨 <b>【閃避成功】影魔身形一閃，完全躲開了${cardName ? ` <b>${cardName}</b>` : "攻擊"}！</b>`, "info");
        return { hit: false, actualDmg: 0 };
    }
    const shieldBefore = S.monster.shield;
    let actualDmg = 0;

    if (ignoreShield || S.monster.shield <= 0) {
        S.monster.hp -= dmg;
        actualDmg = dmg;
    } else if (S.monster.shield >= dmg) {
        S.monster.shield -= dmg;
        actualDmg = 0;
    } else {
        const overflow = dmg - S.monster.shield;
        S.monster.shield = 0;
        S.monster.hp -= overflow;
        actualDmg = overflow;
    }

    // 鋼鐵要塞反震：護盾被「非穿透」攻擊擊破
    if (S.boss.trait === "guardian" && shieldBefore > 0 && S.monster.shield === 0 && !ignoreShield && fromPlayer) {
        log(`🏰💥 <b>【鋼鐵反震】護盾被擊破，鋼鐵碎片反擊造成 15 點真實傷害（無視護盾）！</b>`, "crit");
        dealDamageToPlayer(15, "shield_break", { ignoreShield: true });
    }

    // 荊棘之地：玩家攻擊魔王時反傷玩家
    if (S.mod.effect === "thorns" && fromPlayer && actualDmg + (shieldBefore - S.monster.shield) > 0) {
        log(`🌵 荊棘之地反刺：玩家受到 3 點反傷（無視護盾）`, "warn");
        dealDamageToPlayer(3, "thorns", { ignoreShield: true });
    }
    return { hit: true, actualDmg };
}

function dealDamageToPlayer(rawDmg, source, opts = {}) {
    const { ignoreShield = false } = opts;
    let dmg = rawDmg;
    let shieldAbsorbed = 0;

    if (!ignoreShield && S.player.shield > 0) {
        if (S.player.shield >= dmg) {
            shieldAbsorbed = dmg;
            S.player.shield -= dmg;
            dmg = 0;
        } else {
            shieldAbsorbed = S.player.shield;
            dmg -= S.player.shield;
            S.player.shield = 0;
        }
    }
    S.player.hp -= dmg;

    // 堅甲龜被動
    if (S.hero.trait === "turtlo" && (source === "attack" || source === "roar") && dmg > 0) {
        S.player.shield += 3;
        log(`🛡️ 堅甲龜【堅甲防禦】：受傷後獲得 3 點護盾！`, "shield");
    }

    // 荊棘之地：魔王攻擊玩家時反傷魔王
    if (S.mod.effect === "thorns" && (source === "attack" || source === "roar")) {
        log(`🌵 荊棘之地反刺：魔王受到 3 點反傷（無視護盾）`, "warn");
        S.monster.hp -= 3;
    }
    return { shieldAbsorbed, hpLost: dmg };
}

/* ============================================================
   五、遊戲啟動
   ============================================================ */
function startRandomGame() {
    document.getElementById("tutorial-banner").style.display = "none";
    const h = heroes[Math.floor(Math.random() * heroes.length)];
    const b = bossTypes[Math.floor(Math.random() * bossTypes.length)];
    const m = battlefieldModifiers[Math.floor(Math.random() * battlefieldModifiers.length)];
    initGameWithConfig(h, b, m, false);
}

function startTutorialStage() {
    const h = heroes.find(x => x.id === "shadow");
    const b = bossTypes.find(x => x.id === "standard");
    const m = battlefieldModifiers.find(x => x.effect === "berserk");
    initGameWithConfig(h, b, m, true);
    document.getElementById("tutorial-banner").style.display = "flex";
    S.tutorialStep = 1;
    updateTutorialUI();
}

function skipTutorial() {
    document.getElementById("tutorial-banner").style.display = "none";
    startRandomGame();
}

function startConfiguredGame() {
    const hv = document.getElementById("hero-select").value;
    const bv = document.getElementById("boss-select").value;
    const mv = document.getElementById("modifier-select").value;
    const hero = hv === "random" ? heroes[Math.floor(Math.random() * heroes.length)] : heroes.find(x => x.id === hv);
    const boss = bv === "random" ? bossTypes[Math.floor(Math.random() * bossTypes.length)] : bossTypes.find(x => x.id === bv);
    const mod = mv === "random" ? battlefieldModifiers[Math.floor(Math.random() * battlefieldModifiers.length)] : battlefieldModifiers.find(x => x.effect === mv);
    toggleModal("setup-modal");
    initGameWithConfig(hero, boss, mod, false);
}

function initGameWithConfig(hero, boss, mod, isTutorial) {
    S = createState(hero, boss, mod, isTutorial);
    S.isTutorial = isTutorial;
    S.tutorialStep = 1;

    document.getElementById("player-title-hp").innerText = `${hero.name.split(" ")[0]} 血量`;
    document.getElementById("boss-title-hp").innerText = `${boss.name} 血量`;
    document.getElementById("battlefield-banner").innerText = `英雄：【${hero.name}】｜魔王：【${boss.name}】｜戰場：${mod.name}`;
    document.getElementById("reset-btn").style.display = "none";
    document.getElementById("log-box").innerHTML = "";

    logTurn(`▶ 第 1 回合：【${hero.name}】對決【${boss.name}】正式開始！`, "player");
    if (mod.effect === "sacrifice_altar") log(`🪦 <b>【獻祭祭壇】雙方血量上限 -15！</b>`, "warn");
    if (mod.effect === "iron_wall") log(`🛡️ <b>【鐵壁防線】雙方開局獲得 20 點護盾！</b>`, "shield");

    updateStatus();
    startNewTurn();
    buildCompendiumUI();
    buildHeroUI();
    buildBossUI();
    buildBattlefieldUI();
    updateCurrentBossUI();
}

/* ============================================================
   六、回合流程
   ============================================================ */
function startNewTurn() {
    if (S.gameOver) return;
    S.actionsLeft = S.mod.effect === "double_action" ? 2 : 1;

    // 中毒（無視護盾）
    if (S.monster.poison > 0) {
        applyDamageToMonster(6, { ignoreShield: true, cardName: null, canEvade: false, fromPlayer: false });
        S.monster.poison--;
        log(`☠️ 魔王受到劇毒侵蝕，扣除 6 點血量！（剩餘 ${S.monster.poison} 回合）`, "status");
    }

    // 自然泉源
    if (S.player.regenTurns > 0) {
        const healed = healPlayer(7);
        S.player.regenTurns--;
        log(`🌿 自然泉源生效：回復 <b>${healed}</b> 點生命！（剩餘 ${S.player.regenTurns} 回合）`, "heal");
    }

    // 狂暴磁場（統一無視護盾）
    if (S.mod.effect === "berserk") {
        log(`🔥 狂暴磁場生效：雙方各承受 4 點環境扣血！`, "warn");
        dealDamageToPlayer(4, "env", { ignoreShield: true });
        applyDamageToMonster(4, { ignoreShield: true, cardName: null, canEvade: false, fromPlayer: false });
    }

    if (checkWinLoss()) return;
    updateStatus();
    renderCards();
}

/* ============================================================
   七、玩家出牌
   ============================================================ */
function playCard(card) {
    if (S.gameOver || S.actionsLeft <= 0) return;

    // 教學提示
    if (S.isTutorial) {
        const expected = { 1: "poison", 2: "burst", 3: "detonate" }[S.tutorialStep];
        if (expected && card.subType !== expected) {
            log(`🎓 <b>提示：</b>本步驟建議打出對應卡牌，但你可以繼續嘗試！`, "warn");
        }
    }

    executeCardEffect(card, false);
    if (checkWinLoss()) { finishPlayerAction(); return; }

    // 複製兔
    if (S.hero.trait === "copycat" && !S.heroTraitUsed && card.type === "special") {
        S.heroTraitUsed = true;
        log(`🐰 <b>【鏡像複製】複製兔觸發被動！額外複製一次卡牌效果！</b>`, "crit");
        executeCardEffect(card, true);
        if (checkWinLoss()) { finishPlayerAction(); return; }
    }

    finishPlayerAction();
}

function finishPlayerAction() {
    if (S.gameOver) return;
    S.actionsLeft--;
    updateStatus();

    // 教學推進
    if (S.isTutorial) {
        const expected = { 1: "poison", 2: "burst", 3: "detonate" }[S.tutorialStep];
        // 這裡靠 executeCardEffect 內的 subType 判斷不易，改為在 execute 前記錄
    }

    if (S.actionsLeft > 0) {
        renderCards();
    } else {
        setTimeout(monsterTurn, 600);
    }
}

function executeCardEffect(card, isCopy = false) {
    if (S.gameOver || S.monster.hp <= 0) return;
    const prefix = isCopy ? "🐰 [複製] " : "";
    const dmgMult = S.mod.effect === "berserk" ? 1.2 : 1.0;

    // 教學推進（僅主效果觸發）
    if (S.isTutorial && !isCopy) {
        const expected = { 1: "poison", 2: "burst", 3: "detonate" }[S.tutorialStep];
        if (expected && card.subType === expected) {
            S.tutorialStep++;
            if (S.tutorialStep > 3) S.tutorialStep = 4;
            updateTutorialUI();
        }
    }

    if (card.type === "attack") {
        let dmg = card.value;
        let isCrit = false;

        if (card.subType === "crit") {
            isCrit = Math.random() < 0.4;
            dmg = isCrit ? 25 : 12;
        }
        if (S.player.atkBuff > 0) {
            dmg += S.player.atkBuff;
            log(`🩸 【血之狂熱】攻擊強化 +${S.player.atkBuff} 點！`, "crit");
            S.player.atkBuff = 0;
        }
        if (S.hero.trait === "ignis" && Math.random() < 0.3) {
            dmg += 5;
            log(`🔥 <b>【烈焰血脈】追加 +5 點傷害！</b>`, "crit");
        }
        dmg = Math.round(dmg * dmgMult);

        let result = null;
        if (card.subType === "detonate") {
            const hasDebuff = S.monster.poison > 0 || S.monster.weakTurns > 0;
            const total = dmg + (hasDebuff ? 22 : 0);
            result = applyDamageToMonster(total, { cardName: card.name });
            if (result.hit) {
                if (hasDebuff) {
                    log(`${prefix}💥 <b>元素引爆成功！追加 22 點傷害，共造成 ${total} 點傷害！</b>`, "crit");
                    S.monster.poison = 0;
                    S.monster.weakTurns = 0;
                } else {
                    log(`${prefix}💥 <b>${card.name}</b>：魔王無異常狀態，僅造成 ${total} 點傷害。`, "info");
                }
            }
        } else if (card.subType === "pierce") {
            result = applyDamageToMonster(dmg, { ignoreShield: true, cardName: card.name });
            if (result.hit) log(`${prefix}⚔️ <b>${card.name}</b> 無視護盾造成 <b>${dmg}</b> 點穿透傷害！`, "dmg");
        } else {
            result = applyDamageToMonster(dmg, { cardName: card.name });
            if (result.hit) {
                if (card.subType === "crit") log(`${prefix}⚡ 暴擊判定：${isCrit ? "成功暴擊！" : "普通命中"}`, "info");
                log(`${prefix}⚔️ <b>${card.name}</b> 對魔王造成 <b>${dmg}</b> 點傷害！`, "dmg");
            }
        }

        if (result && result.hit) {
            const extra = S.hero.trait === "shadow" ? 1 : 0;
            if (card.subType === "lifesteal") {
                const healed = healPlayer(7);
                log(`${prefix}✨ 吸血生效：回復 ${healed} 點生命。`, "heal");
            } else if (card.subType === "poison") {
                S.monster.poison = 3 + extra;
                log(`${prefix}🧪 劇毒命中：魔王中毒 ${S.monster.poison} 回合（每回合無視護盾扣 6 血）！`, "status");
            } else if (card.subType === "frost") {
                S.monster.weakTurns = 1 + extra;
                log(`${prefix}❄️ 寒冰凍結：魔王【冰霜虛弱】${S.monster.weakTurns} 回合，攻擊 -40%！`, "status");
            }
            // 閃電鳥
            if (S.hero.trait === "thunder" && Math.random() < 0.15) {
                S.monster.skipTurns += 1;
                log(`⚡ <b>【雷霆麻痺】閃電鳥電擊麻痺魔王，下一次行動將被跳過！</b>`, "crit");
            }
        }

        if (card.subType === "recoil") {
            S.player.hp -= card.selfCost;
            log(`${prefix}💥 捨身代價：承受 ${card.selfCost} 點反噬！`, "dmg");
        }
    }
    else if (card.type === "heal") {
        if (card.subType === "regen") {
            S.player.regenTurns = 3;
            log(`${prefix}🌿 <b>${card.name}</b>：獲得 3 回合泉源祝福（每回合回 7 血）！`, "heal");
        } else {
            const healed = healPlayer(card.value);
            log(`${prefix}💚 <b>${card.name}</b> 回復 <b>${healed}</b> 點生命！`, "heal");
            if (card.subType === "shield") {
                const add = S.hero.trait === "turtlo" ? Math.round(card.shieldVal * 1.1) : card.shieldVal;
                S.player.shield += add;
                log(`${prefix}🛡️ 獲得額外護盾 +${add} 點！`, "shield");
            }
        }
    }
    else if (card.type === "special") {
        if (card.subType === "sacrifice") {
            S.player.hp -= card.costHP;
            S.player.atkBuff = card.buffVal;
            log(`${prefix}🩸 <b>血之狂熱</b>：犧牲 ${card.costHP} 點血量，下次攻擊 +${card.buffVal} 傷害！`, "crit");
        }
        else if (card.subType === "skip") {
            S.monster.skipTurns += 1;
            S.monster.shield = 0;
            S.monster.poison = 0;
            S.monster.weakTurns = 0;
            S.monster.atkBuffTurns = 0;
            log(`${prefix}🔒 <b>禁錮咒語</b>：淨化魔王所有狀態與護盾，並使其跳過 1 次行動！`, "crit");
        }
        else if (card.subType === "reflect") {
            const add = S.hero.trait === "turtlo" ? 11 : 10;
            S.player.shield += add;
            S.player.reflectActive = true;
            log(`${prefix}🪞 獲得 ${add} 點護盾，下回合反彈魔王穿透傷害的 50%！`, "shield");
        }
        else if (card.subType === "shield_bash") {
            if (S.player.shield > 0) {
                const used = S.player.shield;
                const bashDmg = Math.round(used * 1.5);
                const result = applyDamageToMonster(bashDmg, { cardName: card.name });
                if (result.hit) {
                    S.player.shield = 0;
                    log(`${prefix}🛡️💥 <b>盾擊破敵</b>：消耗 ${used} 點護盾，造成 <b>${bashDmg}</b> 點衝擊傷害！`, "crit");
                } else {
                    log(`${prefix}🛡️ 盾擊被閃避，護盾未被消耗！`, "warn");
                }
            } else {
                log(`${prefix}🛡️ 盾擊落空（無護盾）！`, "warn");
            }
        }
        else if (card.subType === "roulette") {
            const roll = Math.random();
            if (roll < 0.33) {
                const capGain = Math.max(0, Math.min(10, 50 - (S.player.maxHp - S.hero.hp)));
                S.player.maxHp += capGain;
                const healed = healPlayer(18);
                log(`${prefix}🎰 <b>命運之輪：生機庇護！</b>回復 ${healed} 點生命，生命上限 +${capGain}（現為 ${S.player.maxHp}）！`, "heal");
            } else if (roll < 0.66) {
                const add = S.hero.trait === "turtlo" ? 20 : 18;
                S.player.shield += add;
                log(`${prefix}🎰 <b>命運之輪：絕對防禦！</b>獲得 ${add} 點護盾！`, "shield");
            } else {
                const result = applyDamageToMonster(22, { ignoreShield: true, cardName: "烈風風刃" });
                if (result.hit) log(`${prefix}🎰 <b>命運之輪：烈風風刃！</b>對魔王造成 22 點穿透傷害！`, "dmg");
            }
        }
    }
}

/* ============================================================
   八、魔王回合
   ============================================================ */
function monsterTurn() {
    if (S.gameOver) return;
    const actions = S.mod.effect === "double_action" ? 2 : 1;
    let hasRoared = false;

    logTurn(`◀ 【${S.boss.name}】反擊回合${actions > 1 ? "（連續行動 2 次）" : ""}`, "monster");

    for (let i = 0; i < actions; i++) {
        if (S.gameOver) break;

        if (S.monster.skipTurns > 0) {
            log(`🔒 <b>魔王被束縛，跳過本次行動！</b>（剩餘 ${S.monster.skipTurns - 1} 次）`, "status");
            S.monster.skipTurns--;
            continue;
        }

        if (S.boss.trait === "standard" && S.turn % 3 === 0 && !hasRoared) {
            hasRoared = true;
            executeRoar();
        } else {
            executeMonsterNormalAction();
        }
        if (checkWinLoss()) return;
    }

    S.player.reflectActive = false;
    S.turn++;
    updateStatus();
    logTurn(`▶ 第 ${S.turn} 回合：你的行動`, "player");
    startNewTurn();
}

function executeRoar() {
    let roarDmg = 18;
    if (S.mod.effect === "berserk") roarDmg = Math.round(roarDmg * 1.2);
    if (S.monster.weakTurns > 0) {
        roarDmg = Math.round(roarDmg * 0.6);
        S.monster.weakTurns--;
        log(`❄️ 魔王受【冰霜虛弱】影響，深淵咆哮威力 -40%！`, "status");
    }
    const result = dealDamageToPlayer(roarDmg, "roar");
    S.player.suppressNext = true;
    const detail = result.shieldAbsorbed > 0
        ? `（護盾吸收 ${result.shieldAbsorbed}，實際承受 ${result.hpLost}）`
        : `（實際承受 ${result.hpLost}）`;
    log(`📢💥 <b>【深淵咆哮】霸主釋放毀滅音波，造成 ${roarDmg} 點傷害${detail}，並施加【壓制】！</b>`, "crit");

    if (S.player.reflectActive && result.hpLost > 0) {
        const reflectDmg = Math.round(result.hpLost * 0.5);
        applyDamageToMonster(reflectDmg, { cardName: "鏡面反射", canEvade: false, fromPlayer: false });
        log(`🔄 <b>鏡面反射生效！反彈 ${reflectDmg} 點傷害給魔王！</b>`, "dmg");
    }
}

function executeMonsterNormalAction() {
    // 鋼鐵要塞：優先補盾
    if (S.boss.trait === "guardian" && S.monster.shield === 0 && Math.random() < 0.7) {
        S.monster.shield += 15;
        log(`🏰 鋼鐵要塞張開「鋼鐵壁壘」，獲得 15 點護盾！`, "shield");
        return;
    }

    // 低血時回血或加盾
    if (S.monster.hp < S.monster.maxHp * 0.5 && Math.random() < 0.45) {
        if (Math.random() < 0.5) {
            const healed = healMonster(20);
            log(`🪄 魔王施展「自我修復」，回復 ${healed} 點生命！`, "heal");
        } else {
            S.monster.shield += 15;
            log(`🛡️ 魔王張開「暗黑護盾」，獲得 15 點護盾！`, "shield");
        }
        return;
    }

    // 暗影狂暴
    if (S.monster.atkBuffTurns <= 0 && Math.random() < 0.3) {
        S.monster.atkBuffTurns = 2;
        log(`🔥 <b>魔王發動「暗影狂暴」！未來 2 次攻擊威力 +8！</b>`, "crit");
        return;
    }

    // 普攻
    let rawDmg = Math.floor(Math.random() * 11) + 12;
    let isBreakArmor = false;
    if (S.monster.atkBuffTurns > 0) {
        rawDmg += 8;
        S.monster.atkBuffTurns--;
        if (Math.random() < 0.3) isBreakArmor = true;
        log(`💥 魔王帶有【暗影狂暴】加成，本次攻擊 +8！`, "warn");
    }
    if (S.mod.effect === "berserk") rawDmg = Math.round(rawDmg * 1.2);
    if (S.monster.weakTurns > 0) {
        rawDmg = Math.round(rawDmg * 0.6);
        S.monster.weakTurns--;
        log(`❄️ 魔王受【冰霜虛弱】影響，攻擊 -40%！`, "status");
    }
    if (isBreakArmor && S.player.shield > 0) {
        const destroyed = Math.floor(S.player.shield * 0.5);
        S.player.shield -= destroyed;
        log(`🗡️💥 <b>魔王施展【破甲打擊】！強行毀壞你 ${destroyed} 點護盾！</b>`, "crit");
    }

    const result = dealDamageToPlayer(rawDmg, "attack");
    const detail = result.shieldAbsorbed > 0
        ? `（護盾吸收 ${result.shieldAbsorbed}，實際承受 ${result.hpLost}）`
        : `（實際承受 ${result.hpLost}）`;
    log(`⚠️ 魔王發動猛擊，造成 <b>${rawDmg}</b> 點總傷害${detail}。`, "dmg");

    // 吸血鬼吸血（基於穿透血量 + 治療枯竭）
    if (S.boss.trait === "vampire" && result.hpLost > 0) {
        const vampHeal = Math.round(result.hpLost * 0.3 * healModifier());
        S.monster.hp = Math.min(S.monster.maxHp, S.monster.hp + vampHeal);
        log(`🧛 <b>【嗜血吸取】德古拉汲取了 ${vampHeal} 點生命治療自己！</b>`, "heal");
    }
    // 反彈護鏡（基於穿透血量）
    if (S.player.reflectActive && result.hpLost > 0) {
        const reflectDmg = Math.round(result.hpLost * 0.5);
        applyDamageToMonster(reflectDmg, { cardName: "鏡面反射", canEvade: false, fromPlayer: false });
        log(`🔄 <b>鏡面反射生效！反彈 ${reflectDmg} 點傷害給魔王！</b>`, "dmg");
    }
}

/* ============================================================
   九、勝負判定
   ============================================================ */
function checkWinLoss() {
    // 不死魔王復活
    if (S.boss.trait === "undying" && S.monster.hp <= 0 && !S.bossRevived) {
        S.bossRevived = true;
        S.monster.hp = Math.min(50, S.monster.maxHp);
        S.monster.atkBuffTurns = 99;
        log(`☠️⚡ <b>【不滅之魂】巴洛克血量歸零，但隨即原地復活！生命恢復至 ${S.monster.hp} 點並進入永久狂暴！</b>`, "crit");
        updateStatus();
        return false;
    }

    const pDead = S.player.hp <= 0;
    const mDead = S.monster.hp <= 0;

    if (pDead && mDead) {
        S.player.hp = 0; S.monster.hp = 0;
        updateStatus();
        log(`🤝 <b>驚天大對決！你與魔王同時倒下，達成【同歸於盡】平局！</b>`, "crit");
        endGame();
        return true;
    }
    if (mDead) {
        S.monster.hp = 0;
        updateStatus();
        if (S.isTutorial) {
            log(`🎉🎓 <b>恭喜完成實戰教學！你已掌握英雄與卡牌 Combo 的核心！</b>`, "crit");
            document.getElementById("tutorial-banner").style.display = "none";
        } else {
            log(`🎉 <b>太強了！你成功擊敗【${S.boss.name}】，完美獲得勝利！</b>`, "crit");
        }
        endGame();
        return true;
    }
    if (pDead) {
        S.player.hp = 0;
        updateStatus();
        log(`❌ <b>冒險失敗：你的生命值歸零。</b>`, "dmg");
        endGame();
        return true;
    }
    return false;
}

function endGame() {
    S.gameOver = true;
    document.getElementById("card-selection").innerHTML = "";
    document.getElementById("reset-btn").style.display = "block";
    if (S.isTutorial) document.getElementById("tutorial-banner").style.display = "none";
}

/* ============================================================
   十、介面渲染
   ============================================================ */
function updateStatus() {
    if (!S) return;
    document.getElementById("player-hp").innerText = `${Math.max(0, S.player.hp)} / ${S.player.maxHp}`;
    document.getElementById("monster-hp").innerText = `${Math.max(0, S.monster.hp)} / ${S.monster.maxHp}`;
    document.getElementById("turn-count").innerText = S.turn;
    document.getElementById("action-points").innerText = `剩餘行動：${S.actionsLeft}`;

    const pTags = [];
    if (S.player.shield > 0) pTags.push(`<span class="status-icon shield">🛡️ ${S.player.shield}</span>`);
    if (S.player.atkBuff > 0) pTags.push(`<span class="status-icon atk">⚔️ +${S.player.atkBuff}</span>`);
    if (S.player.reflectActive) pTags.push(`<span class="status-icon reflect">🪞 護鏡</span>`);
    if (S.player.regenTurns > 0) pTags.push(`<span class="status-icon regen">🌿 ${S.player.regenTurns}T</span>`);
    if (S.player.suppressNext) pTags.push(`<span class="status-icon warn">⚠️ 壓制</span>`);
    document.getElementById("player-buff").innerHTML = pTags.length ? pTags.join(" ") : "正常";

    const mTags = [];
    if (S.monster.shield > 0) mTags.push(`<span class="status-icon shield">🛡️ ${S.monster.shield}</span>`);
    if (S.monster.poison > 0) mTags.push(`<span class="status-icon poison">☠️ ${S.monster.poison}T</span>`);
    if (S.monster.skipTurns > 0) mTags.push(`<span class="status-icon lock">🔒 ${S.monster.skipTurns}</span>`);
    if (S.monster.weakTurns > 0) mTags.push(`<span class="status-icon frost">❄️ ${S.monster.weakTurns}T</span>`);
    if (S.monster.atkBuffTurns > 0) mTags.push(`<span class="status-icon rage">🔥 ${S.monster.atkBuffTurns}次</span>`);
    document.getElementById("monster-buff").innerHTML = mTags.length ? mTags.join(" ") : "正常";
}

function renderCards() {
    if (S.gameOver) return;
    const container = document.getElementById("card-selection");
    container.innerHTML = "";

    let cards = [];
    if (S.isTutorial) {
        const map = { 1: ["poison", "normal", "crit"], 2: ["burst", "normal", "shield"], 3: ["detonate", "normal", "crit"] };
        const list = map[S.tutorialStep] || ["normal", "crit", "shield"];
        const seen = new Set();
        cards = list.map(st => {
            const c = cardPool.find(c => c.subType === st && !seen.has(c.id));
            if (c) seen.add(c.id);
            return c;
        }).filter(Boolean);
    } else {
        const shuffled = [...cardPool].sort(() => 0.5 - Math.random());
        let count = S.mod.effect === "fog_choice" ? 2 : 3;
        if (S.player.suppressNext) {
            count = 1;
            S.player.suppressNext = false;
            log(`⚠️ <b>【壓制生效】本回合僅能從 1 張卡牌中抉擇！</b>`, "warn");
        }
        cards = shuffled.slice(0, count);
    }

    cards.forEach(card => {
        const div = document.createElement("div");
        div.className = `card ${card.type}`;
        if (S.isTutorial) {
            const exp = { 1: "poison", 2: "burst", 3: "detonate" }[S.tutorialStep];
            if (card.subType === exp) div.classList.add("highlight");
        }
        div.innerHTML = `
            <div class="card-type-badge">${card.type === "attack" ? "攻擊" : card.type === "heal" ? "回復" : "特殊"}</div>
            <h3>${card.name}</h3>
            <div class="card-value">${cardValueText(card)}</div>
            <p>${card.desc}</p>
        `;
        div.onclick = () => playCard(card);
        container.appendChild(div);
    });
}

function cardValueText(card) {
    if (card.type === "attack") {
        if (card.subType === "crit") return "12 / 25";
        if (card.subType === "detonate") return "10 (+22)";
        return `${card.value} 傷害`;
    }
    if (card.type === "heal") {
        if (card.subType === "regen") return "每回合 7";
        if (card.subType === "shield") return `回 ${card.value} / 盾 ${card.shieldVal}`;
        return `回復 ${card.value}`;
    }
    if (card.subType === "sacrifice") return `+${card.buffVal} 攻`;
    if (card.subType === "shield_bash") return "×1.5 傷害";
    return "戰術";
}

function updateTutorialUI() {
    if (!S || !S.isTutorial) return;
    const el = document.getElementById("tutorial-text");
    if (S.tutorialStep === 1) el.innerHTML = `<b>🎓 Step 1：</b>觀察影爪貓天賦！請打出 <b>【劇毒飛刀】</b>，觸發被動延長中毒至 4 回合！`;
    else if (S.tutorialStep === 2) el.innerHTML = `<b>🎓 Step 2：</b>被狂暴磁場扣血了！請打出 <b>【瞬間大回復】</b> 拉回血線！`;
    else if (S.tutorialStep === 3) el.innerHTML = `<b>🎓 Step 3：</b>魔王身上帶有劇毒！請打出 <b>【元素引爆】</b> 引爆巨額爆發傷害！`;
    else el.innerHTML = `🎓 教學完成，繼續戰鬥吧！`;
}

/* ============================================================
   十一、圖鑑渲染
   ============================================================ */
function buildHeroUI() {
    document.getElementById("hero-body").innerHTML = heroes.map(h =>
        `<div class="effect-item hero-item"><b>${h.name} - ${h.traitLabel || ""}</b><p><b>初始血量：</b>${h.hp} HP<br><b>天賦：</b>${h.desc}</p></div>`
    ).join("");
}

function buildBossUI() {
    document.getElementById("boss-body").innerHTML = bossTypes.map(b =>
        `<div class="effect-item boss-item"><b>${b.name}</b><p><b>血量：</b>${b.hp}<br><b>特性：</b>${b.desc}</p></div>`
    ).join("");
}

function buildBattlefieldUI() {
    document.getElementById("battlefield-body").innerHTML = battlefieldModifiers.map(m =>
        `<div class="effect-item"><b>${m.name}</b></div>`
    ).join("");
}

function buildCompendiumUI() {
    const body = document.getElementById("compendium-body");
    const groups = [
        { cat: "攻擊型", cls: "atk" },
        { cat: "回復防禦型", cls: "heal" },
        { cat: "特殊戰術型", cls: "special" }
    ];
    body.innerHTML = groups.map(g => {
        const cards = cardPool.filter(c => c.category === g.cat);
        return `
            <div class="compendium-section">
                <h3 class="${g.cls}">${g.cat}</h3>
                <div class="compendium-grid">
                    ${cards.map(c => `<div class="compendium-card"><b>${c.name}</b><p>${c.desc}</p></div>`).join("")}
                </div>
            </div>`;
    }).join("");
}

function updateCurrentBossUI() {
    const body = document.getElementById("current-boss-body");
    if (!S) { body.innerHTML = "<p>戰鬥尚未開始。</p>"; return; }
    const b = S.boss;
    let extra = "";
    if (b.trait === "standard") extra = `<div class="effect-item current-item"><b>📢 專屬大招：深淵咆哮</b><p>每 3 回合發動！造成 <b>18 點傷害</b>，並施加【壓制】使玩家下回合<b>僅剩 1 張卡可選</b>！</p></div>`;
    if (b.trait === "guardian") extra = `<div class="effect-item current-item"><b>🏰 專屬特性：鋼鐵反震</b><p>護盾被<b>非穿透</b>攻擊擊破的瞬間，對玩家造成 <b>15 點真實傷害</b>（無視護盾）！</p></div>`;

    body.innerHTML = `
        ${extra}
        <div class="effect-item current-item">
            <b>👹 當前魔王：${b.name}</b>
            <p><b>基礎血量：</b>${S.monster.maxHp} 點（目前 ${S.monster.hp}）</p>
            <p><b>核心特性：</b>${b.desc}</p>
        </div>
        <div class="effect-item boss-item"><b>⚔️ 招式 1：普通猛擊</b><p>造成 <b>12 ~ 22 點</b> 隨機基礎傷害。</p></div>
        <div class="effect-item boss-item"><b>🔥 招式 2：暗影狂暴</b><p>接下來 2 次攻擊固定 <b>+8 點傷害</b>，且攻擊時 30% 機率毀壞玩家 50% 現有護盾。</p></div>
        <div class="effect-item boss-item"><b>🛡️ 招式 3：暗黑護盾</b><p>為自己張開 <b>15 點防禦護盾</b>。</p></div>
        <div class="effect-item boss-item"><b>🪄 招式 4：自我修復</b><p>立即恢復 <b>20 點生命值</b>（治療枯竭下 12 點）。</p></div>
    `;
}

/* ============================================================
   十二、初始化
   ============================================================ */
window.onload = () => {
    if (!localStorage.getItem("hasVisitedPetAdventureStep")) {
        localStorage.setItem("hasVisitedPetAdventureStep", "true");
        startTutorialStage();
    } else {
        startRandomGame();
    }
};
</script>
</body>
